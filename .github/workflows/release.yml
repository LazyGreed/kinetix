name: release

# Local-first release policy:
# Releases and binary builds are produced and published locally by the maintainer
# using `scripts/release-local.sh <tag> --publish` to avoid wasting GitHub Actions runner hours.
#
# This workflow is kept strictly for manual on-demand workflow_dispatch if remote builds
# are ever explicitly requested by the maintainer.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for, e.g. v0.1.0'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Create release object if not present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Kinetix $TAG" --generate-notes --repo "${{ github.repository }}"
          fi

  binaries:
    name: build (${{ matrix.target }})
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard (embedded into the binary)
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and upload binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kinetix
          target: ${{ matrix.target }}
          archive: kinetix-$tag-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    name: attestations & checksums
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Generate SHA256SUMS and attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p /tmp/release-assets
          cd /tmp/release-assets
          gh release download "$TAG" -p "kinetix-*.tar.gz" --repo "${{ github.repository }}"
          shopt -s nullglob
          ASSETS=(kinetix-*.tar.gz)
          sha256sum "${ASSETS[@]}" > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber --repo "${{ github.repository }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '/tmp/release-assets/kinetix-*.tar.gz'
